name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja, np. 1.0.1"
        required: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check that the version matches the input
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' MacPeach.xcodeproj/project.pbxproj | sort -u)
          test "$version" = "$INPUT_VERSION" || { echo "MARKETING_VERSION=$version, input=$INPUT_VERSION"; exit 1; }
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Security regression tests
        run: Tests/run.sh
      - name: Build (Release, universal)
        run: |
          xcodebuild -project MacPeach.xcodeproj -scheme MacPeach -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build
      - name: Strip symbols and sign ad hoc with Hardened Runtime
        run: |
          app="build/Build/Products/Release/MacPeach.app"
          xcrun strip -S -x "$app/Contents/MacOS/MacPeach"
          codesign --force --sign - --options runtime --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'
      - name: Make DMG and checksums
        run: |
          mkdir -p dist/stage
          cp -R build/Build/Products/Release/MacPeach.app dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname MacPeach -srcfolder dist/stage -format UDZO -ov dist/MacPeach.dmg
          rm -rf dist/stage
          cd dist && shasum -a 256 MacPeach.dmg > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/MacPeach.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MacPeach-${{ inputs.version }}
          path: |
            dist/MacPeach.dmg
            dist/SHA256SUMS
          retention-days: 7
